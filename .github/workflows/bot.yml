name: Swing Breakout Breakdown Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # runs every 15 minutes (UTC)

concurrency:
  group: swing-breakout-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests

      - name: 🚀 Run Breakout / Breakdown Bot
        run: python bot.py
        
